<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Tractor illustration">
  <title>Tractor</title>
  <!-- Original artwork. Stands in where a real photograph has not been
       uploaded yet; see docs/19-IMAGE-SOURCING.md. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8F5"/><stop offset="1" stop-color="#E4F2E8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B8A49"/><stop offset="1" stop-color="#15703A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#sky)"/>
  <!-- field line -->
  <path d="M0 356h600" stroke="#C9DED1" stroke-width="2"/>
  <path d="M0 372h600M0 386h600" stroke="#D9E9DF" stroke-width="2"/>

  <g>
    <!-- rear wheel -->
    <circle cx="196" cy="322" r="74" fill="#0E1B13"/>
    <circle cx="196" cy="322" r="60" fill="none" stroke="#2B3A31" stroke-width="12"/>
    <circle cx="196" cy="322" r="30" fill="#D7DEDA"/>
    <circle cx="196" cy="322" r="11" fill="#8C9A92"/>
    <g stroke="#0E1B13" stroke-width="7" stroke-linecap="round">
      <path d="M196 262v-12M196 394v12M136 322h-12M256 322h12M154 280l-9-9M238 364l9 9M154 364l-9 9M238 280l9-9"/>
    </g>

    <!-- front wheel -->
    <circle cx="436" cy="348" r="46" fill="#0E1B13"/>
    <circle cx="436" cy="348" r="36" fill="none" stroke="#2B3A31" stroke-width="9"/>
    <circle cx="436" cy="348" r="17" fill="#D7DEDA"/>
    <circle cx="436" cy="348" r="6" fill="#8C9A92"/>

    <!-- chassis + bonnet -->
    <path d="M262 316h132a10 10 0 0 0 10-10v-44a12 12 0 0 1 12-12h36a10 10 0 0 1 10 10v56a10 10 0 0 1-10 10h-18"
          fill="url(#body)"/>
    <rect x="352" y="238" width="112" height="70" rx="12" fill="url(#body)"/>
    <rect x="360" y="252" width="96" height="14" rx="7" fill="#0B3D20" opacity=".45"/>
    <rect x="360" y="274" width="96" height="10" rx="5" fill="#0B3D20" opacity=".3"/>

    <!-- cab / seat / steering -->
    <path d="M250 240h92v76h-92z" fill="url(#body)"/>
    <path d="M262 240v-42a10 10 0 0 1 10-10h34a10 10 0 0 1 10 10v42" fill="none"
          stroke="#0B3D20" stroke-width="10" stroke-linejoin="round"/>
    <rect x="268" y="206" width="44" height="34" rx="6" fill="#B8CFC1"/>
    <path d="M232 268h34v30h-34z" fill="#0B3D20"/>
    <path d="M236 268v-22a14 14 0 0 1 28 0" fill="none" stroke="#0B3D20" stroke-width="8" stroke-linecap="round"/>

    <!-- exhaust + headlight -->
    <rect x="392" y="196" width="13" height="46" rx="5" fill="#2B3A31"/>
    <rect x="388" y="188" width="21" height="12" rx="5" fill="#2B3A31"/>
    <circle cx="470" cy="266" r="11" fill="#FFD36B" stroke="#0B3D20" stroke-width="3"/>

    <!-- link arms -->
    <path d="M150 330l-46 18" stroke="#2B3A31" stroke-width="11" stroke-linecap="round"/>
    <path d="M150 300l-40-6" stroke="#2B3A31" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
