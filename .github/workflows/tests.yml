name: Tests

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  # Fast feedback on the PHP floor and the newest release, against SQLite.
  sqlite:
    name: PHP ${{ matrix.php }} · SQLite
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, gd, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting
        if: matrix.php == '8.2'
        run: ./vendor/bin/pint --test

      - name: Check for known vulnerabilities
        if: matrix.php == '8.2'
        run: composer audit

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

  # MySQL is the production target, and it rejects DDL that SQLite accepts
  # silently. Three migration bugs shipped because this job did not exist:
  # TIMESTAMP NOT NULL columns gaining implicit defaults, and a YEAR column
  # that cannot hold 1837. Keep this job.
  mysql:
    name: PHP 8.2 · MySQL 8
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: krishi_junction_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, gd, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.2-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # XAMPP and many shared hosts run with explicit_defaults_for_timestamp
      # off, which is what turns an implicit TIMESTAMP default into a hard
      # failure. Reproduce that here rather than finding out on a client's
      # machine.
      - name: Match the strictest realistic server settings
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            SET GLOBAL sql_mode='ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION';
            SET GLOBAL explicit_defaults_for_timestamp=OFF;"

      - name: Migrate and seed
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: krishi_junction_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate:fresh --seed --force

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: krishi_junction_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
